# Single-host Code Arena stack.
# Boot: npm run certs (once), cp .env.example .env, then npm run up.
# Only Nginx is public. The private judge worker alone owns the Docker socket.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GAME_DB_NAME: ${GAME_DB_NAME}
      GAME_DB_USER: ${GAME_DB_USER}
      GAME_DB_PASSWORD: ${GAME_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Standalone accounts database on separate storage (userpgdata). No import
  # of Saad's root compose.yaml; this stack defines its own user-service.
  user-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      USER_DB_NAME: ${USER_DB_NAME}
      USER_DB_USER: ${USER_DB_USER}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
    volumes:
      - userpgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Standalone accounts service (own lockfile + Node 24 install, private
  # user-service:3000; only Nginx is public).
  user-service:
    build:
      context: ./user-service
    environment:
      NODE_ENV: production
      PORT: "3000"
      POSTGRES_HOST: user-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?set JWT_PRIVATE_KEY in .env}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?set JWT_PUBLIC_KEY in .env}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      AUTH_FRONTEND_URL: ${AUTH_FRONTEND_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-${AUTH_FRONTEND_URL}/api/auth/github/callback}
      GITHUB_LINK_REDIRECT_URI: ${GITHUB_LINK_REDIRECT_URI:-${AUTH_FRONTEND_URL}/api/auth/github/link/callback}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-${AUTH_FRONTEND_URL}/api/auth/discord/callback}
      DISCORD_LINK_REDIRECT_URI: ${DISCORD_LINK_REDIRECT_URI:-${AUTH_FRONTEND_URL}/api/auth/discord/link/callback}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      user-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  judge-worker:
    build:
      context: .
      dockerfile: services/judge-worker/Dockerfile
    environment:
      JUDGE_WORKER_TOKEN: ${JUDGE_WORKER_TOKEN:?set JUDGE_WORKER_TOKEN in .env}
      JUDGE_WORKER_PORT: "3010"
      JUDGE_DOCKER_BIN: docker
      JUDGE_PYTHON_IMAGE: ${JUDGE_PYTHON_IMAGE:-python:3.12-slim}
      JUDGE_GCC_IMAGE: ${JUDGE_GCC_IMAGE:-gcc:14-bookworm}
      JUDGE_WORKER_CONCURRENCY: ${JUDGE_WORKER_CONCURRENCY:-2}
      JUDGE_WORKER_MAX_QUEUE: ${JUDGE_WORKER_MAX_QUEUE:-8}
      JUDGE_WORKER_QUEUE_TIMEOUT_MS: ${JUDGE_WORKER_QUEUE_TIMEOUT_MS:-30000}
      JUDGE_WORKER_JOB_TIMEOUT_MS: ${JUDGE_WORKER_JOB_TIMEOUT_MS:-900000}
    volumes:
      - type: bind
        source: ${JUDGE_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
    networks:
      - judge-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3010/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  game:
    build:
      context: .
      dockerfile: services/game/Dockerfile
    environment:
      SERVICE_NAME: game
      PORT: "3002"
      JUDGE_BACKEND: worker
      JUDGE_WORKER_URL: http://judge-worker:3010
      JUDGE_WORKER_TOKEN: ${JUDGE_WORKER_TOKEN:?set JUDGE_WORKER_TOKEN in .env}
      JUDGE_WORKER_TIMEOUT_MS: ${JUDGE_WORKER_TIMEOUT_MS:-930000}
      DEV_PRINCIPAL: ${DEV_PRINCIPAL:-false}
      RECONNECT_GRACE_MS: ${RECONNECT_GRACE_MS:-90000}
      DATABASE_URL: postgres://${GAME_DB_USER}:${GAME_DB_PASSWORD}@postgres:5432/${GAME_DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge-worker:
        condition: service_healthy
    networks:
      - default
      - judge-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    build:
      context: .
      dockerfile: infra/gateway/Dockerfile
    image: ft-transcendence-gateway:local
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      game:
        condition: service_healthy
      user-service:
        condition: service_healthy

volumes:
  pgdata:
  userpgdata:
  redisdata:

networks:
  judge-internal:
    internal: true
