name: nook-chat-local

services:
  chat-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${CHAT_DB_ADMIN_PASSWORD:?Set CHAT_DB_ADMIN_PASSWORD in .env}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?Set CHAT_DB_PASSWORD in .env}
    ports:
      - '127.0.0.1:${CHAT_DB_PORT:-5433}:5432'
    volumes:
      - chat-data:/var/lib/postgresql
      - ./prisma/init-database.sh:/docker-entrypoint-initdb.d/10-chat.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U nook_chat -d nook_chat']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  chat-data:
