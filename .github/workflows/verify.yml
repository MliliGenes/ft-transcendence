name: Verify Nook

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Complete project checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '1'
      POSTGRES_USER: verify
      POSTGRES_PASSWORD: unused
      POSTGRES_DB: verify_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            chat-service/package-lock.json
            user-service/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix client
          npm ci --prefix chat-service
          npm ci --prefix user-service
      - name: Install checksum-pinned scanner and local hooks
        run: npm run checks:setup
      - name: Run the same full gate used locally
        run: npm run check
      - name: Print stage summary
        if: always()
        run: |
          if test -f .verification/latest-full.json; then
            cat .verification/latest-full.json
          fi
