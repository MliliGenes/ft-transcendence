# Alert rules for Nook. They are evaluated by Prometheus and shown in Grafana
# (Overview dashboard and Alerting > Alert rules). No external delivery is set up.
groups:
  - name: availability
    rules:
      - alert: ServiceDown
        # Only Alloy's blackbox exporter produces probe_success.
        expr: probe_success{service!=""} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is not responding"
          description: "The health probe for {{ $labels.service }} has failed for over a minute."

      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{container_label_com_docker_compose_service!=""}[15m]) > 3
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.container_label_com_docker_compose_service }} keeps restarting"
          description: "The container restarted more than 3 times in 15 minutes."

  - name: resources
    rules:
      - alert: ContainerHighMemory
        # Above 90% of the container's memory limit when one is set,
        # otherwise above 1 GiB.
        expr: |
          (
            container_memory_working_set_bytes{container_label_com_docker_compose_service!=""}
              / (container_spec_memory_limit_bytes{container_label_com_docker_compose_service!=""} > 0)
              > 0.9
          )
          or
          (
            container_memory_working_set_bytes{container_label_com_docker_compose_service!=""} > 1073741824
              unless container_spec_memory_limit_bytes{container_label_com_docker_compose_service!=""} > 0
          )
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.container_label_com_docker_compose_service }} memory is high"
          description: "Working-set memory has stayed above the threshold for 5 minutes."

  - name: databases
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL {{ $labels.database }} is unreachable"
          description: "The exporter cannot connect to {{ $labels.database }}."

      - alert: PostgresTooManyConnections
        expr: |
          sum by (database) (pg_stat_activity_count)
            > on (database) (max by (database) (pg_settings_max_connections) * 0.8)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL {{ $labels.database }} is near its connection limit"
          description: "More than 80% of max_connections have been in use for 5 minutes."

  - name: broker
    rules:
      - alert: RabbitMQQueueBacklog
        expr: sum by (queue) (rabbitmq_detailed_queue_messages_ready) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ queue {{ $labels.queue }} is backing up"
          description: "More than 100 messages have been waiting for 5 minutes; a consumer may be down."

      - alert: RabbitMQUnackedHigh
        expr: sum by (queue) (rabbitmq_detailed_queue_messages_unacked) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ queue {{ $labels.queue }} has many unacknowledged messages"
          description: "Messages were delivered but not acknowledged for 5 minutes; a consumer may be stuck."
