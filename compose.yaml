name: nook

# The monitoring stack (Grafana, Prometheus, Loki, Alloy, cAdvisor) lives in its
# own file but starts with the app. See docs/infra/monitoring.md.
include:
  - compose.monitoring.yaml

# Rotate container logs: at most 3 files of 10 MB per container.
x-logging: &logging
  driver: json-file
  options:  
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    build: ./nginx
    ports:
      - "443:443"
      - "127.0.0.1:9443:9443"
    volumes:
      - ./volumes/nginx/certs:/etc/nginx/certs
    depends_on:
      - user-service
      - client
      - chat-service
      - game-service
      - minio
    logging: *logging

  user-db:
    image: postgres:18-alpine
    env_file:
      - ./envs/user-db.env
      - ./envs/monitoring.env
    environment:
      MONITORING_PASSWORD_ENV: USER_DB_MONITOR_PASSWORD
    volumes:
      - ./volumes/user-db:/var/lib/postgresql
      - ./infra/postgres/10-monitoring-role.sh:/docker-entrypoint-initdb.d/10-monitoring-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    logging: *logging

  chat-db:
    image: postgres:18-alpine
    env_file:
      - ./envs/chat-db.env
      - ./envs/monitoring.env
    environment:
      MONITORING_PASSWORD_ENV: CHAT_DB_MONITOR_PASSWORD
    volumes:
      - ./volumes/chat-db:/var/lib/postgresql
      - ./infra/postgres/10-monitoring-role.sh:/docker-entrypoint-initdb.d/10-monitoring-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    logging: *logging

  game-db:
    image: postgres:18-alpine
    env_file:
      - ./envs/game-db.env
    volumes:
      - ./volumes/game-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    logging: *logging

  redis:
    image: redis:7-alpine
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    env_file: ./envs/rabbitmq.env
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - ./volumes/rabbitmq:/var/lib/rabbitmq
      # Adds the Prometheus plugin (metrics on internal port 15692).
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *logging

  minio:
    build: ./minio
    command: ["server", "/data", "--console-address", ":9001"]
    env_file: ./envs/minio.env
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - ./volumes/minio:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *logging

  # Provisions the chat bucket and its scoped service account on a fresh
  # volume, then exits. Idempotent. Chat waits for it to complete.
  minio-init:
    build: ./minio-init
    env_file:
      - ./envs/minio.env
      - ./envs/chat-service.env
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    logging: *logging

  user-service:
    build: ./user-service
    env_file:
      - ./envs/backend.env
      - ./envs/user-service.env
      - ./envs/user-auth.env
      - ./envs/user-db.env
      - ./envs/rabbitmq.env
    depends_on:
      user-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    logging: *logging

  chat-service:
    build: ./chat-service
    env_file:
      - ./envs/backend.env
      - ./envs/chat-service.env
      - ./envs/chat-db.env
      - ./envs/rabbitmq.env
    depends_on:
      chat-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    logging: *logging

  judge-worker:
    build:
      context: .
      dockerfile: services/judge-worker/Dockerfile
    env_file:
      - ./envs/judge-worker.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - judge-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3010/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    logging: *logging

  game-service:
    build:
      context: .
      dockerfile: services/game/Dockerfile
    env_file:
      - ./envs/backend.env
      - ./envs/game-service.env
      - ./envs/user-auth.env
    depends_on:
      game-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge-worker:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - default
      - judge-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  client:
    build: ./client
    depends_on:
      - user-service
      - chat-service
      - game-service
    logging: *logging

networks:
  default:
    driver: bridge
  judge-internal:
    internal: true
