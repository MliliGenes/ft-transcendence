name: nook

services:
  nginx:
    build: ./nginx
    ports:
      - "443:443"
    volumes:
      - ./volumes/nginx/certs:/etc/nginx/certs
    depends_on:
      - user-service
      - client
      - chat-service

  user-db:
    image: postgres:18-alpine
    env_file: ./envs/user-db.env
    volumes:
      - ./volumes/user-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12

  chat-db:
    image: postgres:18-alpine
    env_file: ./envs/chat-db.env
    volumes:
      - ./volumes/chat-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    env_file: ./envs/rabbitmq.env
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - ./volumes/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  minio:
    build: ./minio
    command: ["server", "/data", "--console-address", ":9001"]
    env_file: ./envs/minio.env
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./volumes/minio:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  user-service:
    build: ./user-service
    env_file:
      - ./envs/backend.env
      - ./envs/user-service.env
      - ./envs/user-auth.env
      - ./envs/user-db.env
      - ./envs/rabbitmq.env
    depends_on:
      user-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  chat-service:
    build: ./chat-service
    env_file:
      - ./envs/backend.env
      - ./envs/chat-service.env
      - ./envs/chat-db.env
      - ./envs/rabbitmq.env
    depends_on:
      chat-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  client:
    build: ./client
    depends_on:
      - user-service
      - chat-service

  auth-profile-web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./auth-profile-web:/app
      - auth-profile-web-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    env_file: ./envs/auth-profile-web.env
    depends_on:
      - user-service
      - chat-service

networks:
  default:
    driver: bridge

volumes:
  auth-profile-web-node-modules:
