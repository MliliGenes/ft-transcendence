name: nook

# The monitoring stack (Grafana, Prometheus, Loki, Alloy, cAdvisor) lives in its
# own file but starts with the app. See docs/services/infrastructure.md.
include:
  - compose.monitoring.yaml

# Rotate container logs: at most 3 files of 10 MB per container.
x-logging: &logging
  driver: json-file
  options:  
    max-size: "10m"
    max-file: "3"

x-db-backup: &db-backup
  image: prodrigestivill/postgres-backup-local:18-alpine
  restart: unless-stopped
  user: postgres:postgres
  logging: *logging

x-db-backup-environment: &db-backup-environment
  POSTGRES_PORT: "5432"
  # Dump every schema; restore ownership/permissions separately if needed.
  POSTGRES_EXTRA_OPTS: "-Z1 --no-owner --no-acl"
  SCHEDULE: "@daily"
  TZ: Africa/Casablanca
  BACKUP_ON_START: "TRUE"
  BACKUP_KEEP_DAYS: "7"
  BACKUP_KEEP_WEEKS: "4"
  BACKUP_KEEP_MONTHS: "6"
  HEALTHCHECK_PORT: "8080"

services:
  nginx:
    build: ./nginx
    ports:
      - "443:443"
      - "127.0.0.1:9443:9443"
    volumes:
      - ./volumes/nginx/certs:/etc/nginx/certs
    depends_on:
      - user-service
      - client
      - chat-service
      - minio
    logging: *logging

  user-db:
    image: postgres:18-alpine
    env_file:
      - ./envs/user-db.env
      - ./envs/monitoring.env
    environment:
      MONITORING_PASSWORD_ENV: USER_DB_MONITOR_PASSWORD
    volumes:
      - ./volumes/user-db:/var/lib/postgresql
      - ./infra/postgres/10-monitoring-role.sh:/docker-entrypoint-initdb.d/10-monitoring-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    logging: *logging

  chat-db:
    image: postgres:18-alpine
    env_file:
      - ./envs/chat-db.env
      - ./envs/monitoring.env
    environment:
      MONITORING_PASSWORD_ENV: CHAT_DB_MONITOR_PASSWORD
    volumes:
      - ./volumes/chat-db:/var/lib/postgresql
      - ./infra/postgres/10-monitoring-role.sh:/docker-entrypoint-initdb.d/10-monitoring-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    logging: *logging

  # Named volumes support the hardlinks/symlinks used for backup rotation,
  # including on Docker Desktop. Only this one-shot initializer runs as root.
  backup-storage-init:
    image: postgres:18-alpine
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        chown postgres:postgres /user-backups /chat-backups
        chmod 0700 /user-backups /chat-backups
    volumes:
      - user-db-backups:/user-backups
      - chat-db-backups:/chat-backups
    restart: "no"
    logging: *logging

  user-db-backup:
    <<: *db-backup
    env_file: ./envs/user-db.env
    environment:
      <<: *db-backup-environment
      POSTGRES_HOST: user-db
    volumes:
      - user-db-backups:/backups
    depends_on:
      user-db:
        condition: service_healthy
      backup-storage-init:
        condition: service_completed_successfully

  chat-db-backup:
    <<: *db-backup
    env_file: ./envs/chat-db.env
    environment:
      <<: *db-backup-environment
      POSTGRES_HOST: chat-db
    volumes:
      - chat-db-backups:/backups
    depends_on:
      chat-db:
        condition: service_healthy
      backup-storage-init:
        condition: service_completed_successfully

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    env_file: ./envs/rabbitmq.env
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - ./volumes/rabbitmq:/var/lib/rabbitmq
      # Adds the Prometheus plugin (metrics on internal port 15692).
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *logging

  minio:
    build: ./minio
    command: ["server", "/data", "--console-address", ":9001"]
    env_file: ./envs/minio.env
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - ./volumes/minio:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *logging

  # Provisions the chat bucket and its scoped service account on a fresh
  # volume, then exits. Idempotent. Chat waits for it to complete.
  minio-init:
    build: ./minio-init
    env_file:
      - ./envs/minio.env
      - ./envs/chat-service.env
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    logging: *logging

  user-service:
    build: ./user-service
    env_file:
      - ./envs/backend.env
      - ./envs/user-service.env
      - ./envs/user-auth.env
      - ./envs/user-db.env
      - ./envs/rabbitmq.env
    depends_on:
      user-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    logging: *logging

  chat-service:
    build: ./chat-service
    env_file:
      - ./envs/backend.env
      - ./envs/chat-service.env
      - ./envs/chat-db.env
      - ./envs/rabbitmq.env
    depends_on:
      chat-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    logging: *logging

  client:
    build: ./client
    depends_on:
      - user-service
      - chat-service
    logging: *logging

volumes:
  user-db-backups:
  chat-db-backups:

networks:
  default:
    driver: bridge
