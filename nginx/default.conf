resolver 127.0.0.11 valid=10s ipv6=off;

upstream user_api {
    zone user_api 64k;
    server user-service:3000 resolve;
}

upstream test_frontend {
    zone test_frontend 64k;
    server auth-profile-web:5173 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Keep OAuth authorization codes and state out of access logs.
log_format gateway '$remote_addr "$request_method $uri" $status';

server {
    listen 443 ssl;
    server_name localhost localhost:443;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/access.log gateway;

    # Allow the API's 5 MiB banner upload plus multipart overhead.
    client_max_body_size 6m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /api {
        return 308 /api/$is_args$args;
    }

    location /api/ {
        # Trailing slash strips /api/ while preserving the query string.
        proxy_pass http://user_api/;
        proxy_cookie_path /auth/ /api/auth/;
    }

    location / {
        # Includes frontend routes, assets, and Vite's WebSocket connection.
        proxy_pass http://test_frontend;
    }
}
