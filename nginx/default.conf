resolver 127.0.0.11 valid=10s ipv6=off;

upstream user_api {
    zone user_api 64k;
    server user-service:3000 resolve;
}

upstream client {
    zone client 64k;
    server client:3000 resolve;
}

upstream chat_api {
    zone chat_api 64k;
    server chat-service:3000 resolve;
}

upstream game_api {
    zone game_api 64k;
    server game-service:3002 resolve;
}

upstream minio_s3 {
    zone minio_s3 64k;
    server minio:9000 resolve;
}

upstream grafana {
    zone grafana 64k;
    server grafana:3000 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map "$request_method:$uri" $auth_login_rate_key {
    default '';
    "POST:/api/auth/login" $binary_remote_addr;
}

map "$request_method:$uri" $auth_register_rate_key {
    default '';
    "POST:/api/auth/register" $binary_remote_addr;
}

map "$request_method:$uri" $password_reset_request_rate_key {
    default '';
    "POST:/api/auth/password-reset/request" $binary_remote_addr;
}

map "$request_method:$uri" $password_reset_confirm_rate_key {
    default '';
    "POST:/api/auth/password-reset/confirm" $binary_remote_addr;
}

server {
    listen 9443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 50 MiB video limit plus multipart overhead.
    client_max_body_size 52m;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_pass http://minio_s3;
    }
}

limit_req_zone $auth_login_rate_key zone=auth_login:10m rate=10r/m;
limit_req_zone $auth_register_rate_key zone=auth_register:10m rate=3r/m;
limit_req_zone $password_reset_request_rate_key zone=password_reset_request:10m rate=3r/m;
limit_req_zone $password_reset_confirm_rate_key zone=password_reset_confirm:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_all:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=api_chat:10m rate=600r/m;

log_format gateway '$remote_addr "$request_method $uri" $status';

server {
    listen 443 ssl;
    server_name localhost localhost:443 localhost:8443;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/access.log gateway;

    client_max_body_size 6m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /api {
        return 308 /api/$is_args$args;
    }

    # Public health & system status API
    location = /api/status {
        limit_req_status 429;
        limit_req zone=api_all burst=10 nodelay;
        proxy_pass http://client/api/status;
    }

    location /api/ {
        limit_req_status 429;
        limit_req zone=api_all burst=10 nodelay;
        limit_req zone=auth_login burst=5 nodelay;
        limit_req zone=auth_register burst=2 nodelay;
        limit_req zone=password_reset_request burst=2 nodelay;
        limit_req zone=password_reset_confirm burst=4 nodelay;

        proxy_pass http://user_api/;
        proxy_cookie_path /auth/ /api/auth/;
    }

    # Canonical API paths. Keep the legacy /chat and /socket.io routes below for existing clients.
    location = /api/chat {
        return 308 /api/chat/$is_args$args;
    }

    location /api/chat/socket.io/ {
        limit_req_status 429;
        limit_req zone=api_all burst=60 nodelay;
        proxy_buffering off;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_pass http://chat_api/socket.io/;
    }

    location /api/chat/ {
        limit_req_status 429;
        limit_req zone=api_chat burst=60 nodelay;
        proxy_pass http://chat_api/chat/;
    }
    location /socket.io/ {
        proxy_buffering off;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_pass http://chat_api;
    }

    # Canonical Game API and WebSocket paths
    location = /api/game {
        return 308 /api/game/$is_args$args;
    }

    location /api/game/socket.io/ {
        limit_req_status 429;
        limit_req zone=api_all burst=60 nodelay;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_pass http://game_api/socket.io/;
    }

    location /api/game/ {
        limit_req_status 429;
        limit_req zone=api_all burst=30 nodelay;
        proxy_pass http://game_api/;
    }

    # Direct match and lobby routes for Code Arena compatibility
    location ~ ^/(matches|lobby)(/|$) {
        limit_req_status 429;
        limit_req zone=api_all burst=60 nodelay;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_pass http://game_api;
    }

    # Monitoring: only Grafana is exposed, and it requires a login.
    # Prometheus, Loki, Alloy and cAdvisor have no route here on purpose.
    location = /grafana {
        return 308 /grafana/;
    }

    location /grafana/ {
        limit_req_status 429;
        limit_req zone=api_all burst=60 nodelay;
        proxy_pass http://grafana;
    }

    location / {
        proxy_pass http://client;
    }
}
