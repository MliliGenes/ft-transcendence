<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><title>Team chat acknowledgement fixture</title></head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement } from "react";
      import { createRoot } from "react-dom/client";
      import { TeamChatClient } from "../src/arena/chat.ts";
      import { TeamChat } from "../src/components/TeamChat.tsx";

      const pending = [];
      const sent = [];
      const client = new TeamChatClient({
        baseUrl: "http://unused.test",
        userId: "alice",
        matchId: "match",
      });
      Object.defineProperty(client, "status", { get: () => "connected" });
      client.sendMessage = (text) => {
        sent.push(text);
        return new Promise((resolve, reject) => pending.push({ resolve, reject }));
      };
      window.teamChatHarness = {
        sent,
        async settle(index, error) {
          const request = pending[index];
          if (error) request.reject(new Error(error));
          else request.resolve(`message-${index}`);
          // Let the real React component finish the acknowledgement update.
          await new Promise(requestAnimationFrame);
          await new Promise(requestAnimationFrame);
        },
      };
      const fallback = new URLSearchParams(location.search).has("fallback");
      createRoot(document.getElementById("root")).render(createElement(TeamChat, { client: fallback ? null : client }));
    </script>
  </body>
</html>
